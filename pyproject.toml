[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "bathy-labeler"
version = "0.1.0"
description = "Local ICESat-2 photon classification tool"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "cmcrameri>=1.9",
  "contextily>=1.6",
  "fastapi>=0.115",
  "geopandas>=1.0",
  "h5py>=3.10",
  "matplotlib>=3.8",
  "matplotlib-scalebar>=0.9",
  "numpy>=1.26",
  "pyproj>=3.6",
  "pyarrow>=17",
  "rasterio>=1.4",
  "typer>=0.12",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "black>=24.8",
  "httpx>=0.27",
  "pytest>=8.2",
]

[project.scripts]
bathy-labeler = "bathy_labeler.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.black]
line-length = 80
target-version = ["py310"]
